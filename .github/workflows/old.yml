name: Android 12 / 5.10 GKI Kernel Driver Builder

on:
  workflow_dispatch:
    inputs:
      driver_name:
        description: 'Driver Module Name (e.g., lsdriver.ko)'
        required: true
        default: 'lsdriver.ko'
      target_arch:
        description: 'Target Architecture (aarch64, x86_64, etc.)'
        required: true
        default: 'aarch64'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 关键改动 1：原 mv 只会搬顶层 .c/.h/Makefile，会漏掉 arm64_encode/ 等子目录
      #             改成 cp -r ./code/. 保留完整目录结构
      - name: Prepare kerneldriver directory
        run: |
          mkdir -p kerneldriver
          cp -r ./code/. kerneldriver/
          ls -R kerneldriver | head -50

      - name: Install repo tool
        run: |
          sudo curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Sync Android 12 / 5.10 kernel
        run: |
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync

      - name: Copy driver into kernel tree
        run: |
          cd android-kernel
          cp -r ../kerneldriver common/drivers/

      # 关键改动 2：删掉了 obj-y += kerneldriver/，改为只走 GKI modules 列表。
      #             obj-y 会把驱动编成 built-in，不是 .ko
      - name: Add module to GKI modules list (legacy)
        run: |
          cd android-kernel
          echo "drivers/kerneldriver/${{ inputs.driver_name }}" \
            >> common/android/gki_${{ inputs.target_arch }}_modules
          echo "--- tail of gki_${{ inputs.target_arch }}_modules ---"
          tail -5 common/android/gki_${{ inputs.target_arch }}_modules

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python-is-python3

      # Android 12 / 5.10 走 legacy build 路径（build.sh + LTO=thin）
      - name: Build kernel with driver
        run: |
          cd android-kernel
          BUILD_CONFIG=common/build.config.gki.${{ inputs.target_arch }} \
          LTO=thin \
          build/build.sh -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-${{ inputs.target_arch }}
          path: android-kernel/out/android12-5.10/dist/**
          if-no-files-found: warn
