name: Android 12 / 5.10 GKI Kernel Driver Builder

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare kerneldriver directory
        run: |
          set -eux
          mkdir -p kerneldriver
          cp -r ./code/. kerneldriver/
          echo "--- kerneldriver/ ---"
          ls -R kerneldriver | head -80

      - name: Patch driver include paths
        run: |
          set -eux
          cd kerneldriver

          # 1) 干掉所有 ../arm64_*/ 和 arm64_*/ 前缀（带子目录的）
          find . \( -name '*.c' -o -name '*.h' \) -print0 | xargs -0 sed -i \
            -e 's|"\.\./arm64_encode/|"|g' \
            -e 's|"\.\./arm64_decode/|"|g' \
            -e 's|"\.\./arm64_emulate/|"|g' \
            -e 's|"arm64_encode/|"|g' \
            -e 's|"arm64_decode/|"|g' \
            -e 's|"arm64_emulate/|"|g'

          # 2) 新增: 干掉裸的 "../xxx.h" 前缀
          #    匹配 "../文件名.h"（文件名里不含 /），转成 "文件名.h"
          find . \( -name '*.c' -o -name '*.h' \) -print0 | xargs -0 sed -i \
            -e 's|"\.\./\([^/"]*\)"|"\1"|g'

          # 3) 检查残留的带子目录前缀（应为空）
          echo "=== residual subdir includes (should be none) ==="
          grep -rn '#include[[:space:]]*"[^"]*arm64_\(encode\|decode\|emulate\)/' \
            --include='*.c' --include='*.h' . || echo "none"

          # 4) 新增: 检查所有残留的 ../ include（应为空）
          echo "=== residual ../ includes (should be none) ==="
          grep -rn '#include[[:space:]]*"\.\./' \
            --include='*.c' --include='*.h' . || echo "none"

          # 5) 补齐 arm64_ptedbg.h（如果还没有）
          if [ ! -f arm64_ptedbg.h ]; then
            if [ -f arm64_ptedbg3.h ]; then
              echo ">>> cp arm64_ptedbg3.h -> arm64_ptedbg.h"
              cp arm64_ptedbg3.h arm64_ptedbg.h
            elif [ -n "$(ls arm64_ptedbg-*.h 2>/dev/null)" ]; then
              LATEST=$(ls arm64_ptedbg-*.h | sort | tail -1)
              echo ">>> cp $LATEST -> arm64_ptedbg.h"
              cp "$LATEST" arm64_ptedbg.h
            else
              echo "!!! no arm64_ptedbg* candidate found"
            fi
          fi
          ls -la arm64_ptedbg*.h || true

          # 6) 列出所有被引用但仓库里没有的头文件
          echo "=== missing headers (referenced but not present) ==="
          grep -rhoP '#include[[:space:]]+"\K[^"]+\.h' \
            --include='*.c' --include='*.h' . \
            | sort -u \
            | while read f; do
                [ -f "$f" ] || echo "MISSING: $f"
              done || true
          echo "=== end missing headers ==="

      - name: Install repo tool
        run: |
          set -eux
          sudo curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Sync Android 12 / 5.10 kernel
        run: |
          set -eux
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync

      - name: Copy driver into kernel tree
        run: |
          set -eux
          cd android-kernel
          cp -r ../kerneldriver common/drivers/
          ls -R common/drivers/kerneldriver | head -80

      - name: Hook kerneldriver into Kbuild
        run: |
          set -eux
          cd android-kernel
          echo "obj-m += kerneldriver/" >> common/drivers/Makefile
          tail -5 common/drivers/Makefile

      - name: Add module to GKI modules list (legacy)
        run: |
          set -eux
          cd android-kernel
          echo "drivers/kerneldriver/lsdriver.ko" >> common/android/gki_aarch64_modules
          cat common/android/gki_aarch64_modules

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python-is-python3

      - name: Build kernel with driver
        run: |
          set -eux
          cd android-kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          LTO=thin \
          build/build.sh -j$(nproc)

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-aarch64
          path: android-kernel/out/android12-5.10/dist/**
          if-no-files-found: warn
